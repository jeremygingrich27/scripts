# phonon_downhill settings.  Sourced by downhill.sh and the job scripts.
# (J) = Jeremy decided 2026-10-16.  (C) = Claude's default, open for Jeremy to change.

# --- machine (LS6)
VASP=/home1/10117/jerging27/software/vasp/vasp.6.5.1/bin/vasp_std
VENV=$HOME/.venvs/crystal          # python with numpy, spglib, phonopy, pyyaml, crystal-utilities (C: path)
ALLOC=PHY24018
QUEUE=normal                       # (J)
NODES=1                            # (J) same as the existing runs
TASKS=128
SCRATCH_DIR=$SCRATCH/phonon_downhill   # CHGCARs go to $SCRATCH_DIR/<job id>/<run path> (J: qe_scripts style)

# --- walltime (J: scaled to the work, capped at 48 h, jobs resubmit themselves)
SP_MINUTES=40                      # (C) one 64-atom single point, from the freeze runs (~38 min)
MAX_WALL_H=48
RELAX_WALL_H=24                    # (C) a relax round cannot be predicted; VASP is stopped cleanly
STOPCAR_MARGIN_MIN=60              # (C) ... this long before the walltime (STOPCAR LSTOP)
SCAN_POINTS_PER_JOB=10             # (C) walltime of a scan job = this many points

# --- RELAX
MAX_RELAX_ROUNDS=8                 # (C) stop the branch if Pulay rounds never converge
AB_TOL=1e-4                        # (C) A; a,b must stay at the clamp value to this
MIN_MOMENT=0.3                     # (C) uB; below this a Cu moment counts as collapsed

# --- SYMMETRY
SYMPREC=1e-3                       # (J) findsym tolerance, A; also used for spglib

# --- PHONONS
DISPLACEMENT=0.01                  # (J) A, DIM 1 1 1, phonopy default +/-
THRESHOLD=-0.1                     # (J) THz; below this a mode is unstable
DEGEN_TOL=0.005                    # (C) THz; modes this close to the lowest form its multiplet

# --- SCAN
STEP=0.02                          # (J) A, largest single-atom displacement
NPAST=3                            # (J) points past the lowest before the scan stops

# --- tree
MAX_ROUNDS=5                       # (J) per branch
